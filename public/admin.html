<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZaeemWeb Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<header class="bg-black text-white py-4 px-6 shadow-lg">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-2xl font-bold">ZAEEMWEB ADMIN</h1>
    <a href="/api/products" target="_blank" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">View API</a>
  </div>
</header>

<main class="max-w-6xl mx-auto p-6">

  <div class="bg-white rounded-lg shadow-md p-6 mb-8">
    <h2 class="text-xl font-bold mb-4 text-gray-800">Add New Product</h2>

    <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Product Name *</label>
        <input type="text" id="name" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Price (Rs.) *</label>
        <input type="number" id="price" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select id="category" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black">
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Kids">Kids</option>
          <option value="General">General</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
        <input type="text" id="image" placeholder="https://..." class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Sizes (comma separated)</label>
        <input type="text" id="sizes" placeholder="S, M, L, XL" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Colors (comma separated)</label>
        <input type="text" id="colors" placeholder="Black, White, Blue" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black" />
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea id="description" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black"></textarea>
      </div>

      <div class="md:col-span-2">
        <button type="submit" class="w-full bg-black text-white py-3 rounded font-semibold hover:bg-gray-800 transition">
          Add Product
        </button>
      </div>
    </form>

    <p id="message" class="mt-3 text-center text-sm font-medium"></p>
  </div>

  <div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-xl font-bold mb-4 text-gray-800">All Products</h2>
    <div id="productsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="text-gray-500 col-span-full text-center py-8">Loading products...</p>
    </div>
  </div>

</main>

<script>
var API_URL = '/api/products';

document.addEventListener('DOMContentLoaded', function() {
  loadProducts();
});

document.getElementById('productForm').addEventListener('submit', function(e) {
  e.preventDefault();

  var messageEl = document.getElementById('message');

  var productData = {
    name: document.getElementById('name').value.trim(),
    price: parseFloat(document.getElementById('price').value),
    category: document.getElementById('category').value,
    image: document.getElementById('image').value.trim(),
    description: document.getElementById('description').value.trim(),
    sizes: document.getElementById('sizes').value.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; }),
    colors: document.getElementById('colors').value.split(',').map(function(c) { return c.trim(); }).filter(function(c) { return c; })
  };

  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(productData)
  })
  .then(function(response) {
    if (response.ok) {
      return response.json();
    } else {
      throw new Error('Failed to add product');
    }
  })
  .then(function(data) {
    messageEl.textContent = 'Product added successfully!';
    messageEl.className = 'mt-3 text-center text-sm font-medium text-green-600';
    document.getElementById('productForm').reset();
    loadProducts();
  })
  .catch(function(err) {
    messageEl.textContent = 'Error: ' + err.message;
    messageEl.className = 'mt-3 text-center text-sm font-medium text-red-600';
  });
});

function loadProducts() {
  var listEl = document.getElementById('productsList');

  fetch(API_URL)
    .then(function(response) { return response.json(); })
    .then(function(products) {
      if (products.length === 0) {
        listEl.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No products yet. Add your first product above!</p>';
        return;
      }

      var html = '';
      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        html += '<div class="border border-gray-200 rounded-lg overflow-hidden shadow-sm hover:shadow-md transition">';
        if (p.image) {
          html += '<img src="' + p.image + '" alt="' + p.name + '" class="w-full h-48 object-cover" />';
        } else {
          html += '<div class="w-full h-48 bg-gray-200 flex items-center justify-center text-gray-400">No Image</div>';
        }
        html += '<div class="p-4">';
        html += '<h3 class="font-bold text-gray-800">' + p.name + '</h3>';
        html += '<p class="text-lg font-semibold text-green-600 mt-1">Rs. ' + p.price + '</p>';
        html += '<p class="text-sm text-gray-500 mt-1">' + p.category + '</p>';
        html += '<button onclick="deleteProduct(' + p.id + ')" class="mt-3 w-full bg-red-600 text-white py-2 rounded text-sm font-medium hover:bg-red-700 transition">Delete</button>';
        html += '</div></div>';
      }
      listEl.innerHTML = html;
    })
    .catch(function(err) {
      listEl.innerHTML = '<p class="text-red-500 col-span-full text-center py-8">Failed to load products: ' + err.message + '</p>';
    });
}

function deleteProduct(id) {
  if (!confirm('Are you sure you want to delete this product?')) return;

  fetch(API_URL + '/' + id, { method: 'DELETE' })
    .then(function(response) {
      if (response.ok) {
        loadProducts();
      } else {
        alert('Failed to delete product');
      }
    })
    .catch(function(err) {
      alert('Network error: ' + err.message);
    });
}
</script>

</body>
</html>
